<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Package QR">
<title>Amazon Package QR Scanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    background: #fff;
    color: #111;
    display: flex;
    flex-direction: column;
  }
  .nav {
    flex: none;
    margin: 0;
    padding: max(.85rem, env(safe-area-inset-top)) 1rem .85rem;
    background: #111;
    color: #fff;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .screen {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1.25rem;
    overflow: auto;
  }
  button { touch-action: manipulation; font: inherit; cursor: pointer; }
  #scan, #dismiss {
    font-size: 1.35rem;
    font-weight: 700;
    padding: 1rem 2.4rem;
    border: 0;
    border-radius: 999px;
    background: #111;
    color: #fff;
  }
  #scan { font-size: 2rem; padding: 1.25rem 3rem; }
  #scan:disabled { opacity: .4; }
  body { overflow: hidden; }
  #cam { position: relative; padding: 0; background: #000; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #veil {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: .6rem;
    padding: .75rem 1rem max(1rem, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #finder {
    position: relative;
    flex: 1 1 auto;
    width: min(86%, 440px);
    max-height: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 1.25rem;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .55);
  }
  #finder span {
    position: absolute;
    width: 1.6rem;
    height: 1.6rem;
    border: 3px solid #fff;
  }
  #finder span:nth-child(1) { top: .55rem; left: .55rem; border-right: 0; border-bottom: 0; border-radius: .35rem 0 0 0; }
  #finder span:nth-child(2) { top: .55rem; right: .55rem; border-left: 0; border-bottom: 0; border-radius: 0 .35rem 0 0; }
  #finder span:nth-child(3) { bottom: .55rem; left: .55rem; border-right: 0; border-top: 0; border-radius: 0 0 0 .35rem; }
  #finder span:nth-child(4) { bottom: .55rem; right: .55rem; border-left: 0; border-top: 0; border-radius: 0 0 .35rem 0; }
  #status, #hint {
    flex: none;
    margin: 0;
    max-width: 92%;
    padding: .4rem .75rem;
    border-radius: 999px;
    background: rgba(0, 0, 0, .6);
    color: #fff;
    text-align: center;
  }
  #hint { font-size: 1rem; font-weight: 600; }
  #status { font-size: .95rem; opacity: .95; }
  #cancel {
    pointer-events: auto;
    flex: none;
    font-size: 1.1rem;
    padding: .8rem 1.6rem;
    border: 0;
    border-radius: 999px;
    background: #fff;
    color: #111;
  }
  #qr img { width: min(52dvh, 78vw, 340px); height: auto; image-rendering: pixelated; }
  #pid {
    margin: 0;
    font-family: ui-monospace, monospace;
    font-size: 1.35rem;
    letter-spacing: .04em;
    text-align: center;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="nav">Amazon Package QR Scanner</header>
<main id="home" class="screen">
  <button id="scan" type="button" disabled>Scan</button>
</main>
<section id="cam" class="screen" hidden>
  <video id="video" autoplay playsinline muted></video>
  <div id="veil">
    <p id="status">Looking for package ID…</p>
    <div id="finder" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p id="hint">Fit the scanner screen in the frame</p>
    <button id="cancel" type="button">Cancel</button>
  </div>
</section>
<section id="result" class="screen" hidden>
  <div id="qr"></div>
  <p id="pid"></p>
  <button id="dismiss" type="button">Dismiss</button>
</section>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  const DIGIT_FIX = { O: "0", I: "1", L: "1", S: "5", B: "8" };

  // ponytail: fix O/I/L/S/B only in the 12-digit tail, and 1->T / 8->B only in the TB prefix.
  // Ceiling: Z/2 and G/6 still miss. Upgrade path: per-character OCR confidence.
  function findPackageId(text) {
    const compact = text.toUpperCase().replace(/\s+/g, "");
    let best = null;
    let bestCost = 99;
    for (let i = 0; i <= compact.length - 15; i++) {
      let cost = 0;
      let c0 = compact[i];
      let c1 = compact[i + 1];
      if (c0 === "1") { c0 = "T"; cost++; }
      else if (c0 !== "T") continue;
      if (c1 === "8") { c1 = "B"; cost++; }
      else if (c1 !== "B") continue;
      const letter = compact[i + 2];
      if (letter < "A" || letter > "Z") continue;
      const tail = compact.slice(i + 3, i + 15);
      let digits = "";
      let ok = true;
      for (const c of tail) {
        if (c >= "0" && c <= "9") digits += c;
        else if (DIGIT_FIX[c]) { digits += DIGIT_FIX[c]; cost++; }
        else { ok = false; break; }
      }
      if (!ok) continue;
      const id = "TB" + letter + digits;
      if (cost < bestCost) { best = id; bestCost = cost; }
    }
    return best;
  }

  function selfCheck() {
    const cases = [
      ["TBC086774826009", "TBC086774826009"],
      ["tbc086050802009", "TBC086050802009"],
      ["TBC085237824009", "TBC085237824009"],
      ["TBC08677\n4826009", "TBC086774826009"],
      ["TBCO860508020092", "TBC086050802009"],
      ["TBC086774B26009", "TBC086774826009"],
      ["18C086774826009", "TBC086774826009"],
      ["T8C085237824009", "TBC085237824009"],
      ["TBS086774826009", "TBS086774826009"],
      ["TBO086774826009", "TBO086774826009"],
      ["XZEBRASFOO19778143S4I09009XRPSL18C086774826009Q1PDMBAWCOA202DC", "TBC086774826009"],
      ["YZEBRAV20686S4O7ONBO4AMRP4SPTBC086050802009BBPIDXSBSNSJ0MHN001X11A203AI", "TBC086050802009"],
      ["QZEBRA680O31T0G0680S4SCPTBC085237824009844265F036414788210062XWCS2C91BC91C44", "TBC085237824009"],
      ["NSQZEBRA58694190080SCPPT8C085237824009Q84426503641WB47832100620C91BC91C4", "TBC085237824009"],
      ["SNtSJdgMHN_001_v", null],
      ["8cbcc442-6510-5641-cbcb-478ae210d62d", null],
      ["A-20.2D", null],
      ["TBC123", null],
    ];
    for (const [input, expected] of cases) {
      const got = findPackageId(input);
      if (got !== expected) {
        throw new Error("findPackageId(" + JSON.stringify(input) + ") => " + got + ", expected " + expected);
      }
    }
  }
  selfCheck();

  const home = document.getElementById("home");
  const cam = document.getElementById("cam");
  const result = document.getElementById("result");
  const video = document.getElementById("video");
  const statusEl = document.getElementById("status");
  const qrEl = document.getElementById("qr");
  const pidEl = document.getElementById("pid");
  const scanBtn = document.getElementById("scan");
  const thumb = document.createElement("canvas");

  let stream = null;
  let worker = null;
  let workerReady = null;
  let scanning = false;
  let timer = 0;
  let generation = 0;

  function show(which) {
    home.hidden = which !== "home";
    cam.hidden = which !== "cam";
    result.hidden = which !== "result";
  }

  function boxBlur(src, w, h, r) {
    const tmp = new Uint8Array(src.length);
    const dst = new Uint8Array(src.length);
    const div = r * 2 + 1;
    for (let y = 0; y < h; y++) {
      let sum = 0;
      for (let x = -r; x <= r; x++) sum += src[y * w + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = Math.round(sum / div);
        sum -= src[y * w + Math.min(w - 1, Math.max(0, x - r))];
        sum += src[y * w + Math.min(w - 1, Math.max(0, x + r + 1))];
      }
    }
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let y = -r; y <= r; y++) sum += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        dst[y * w + x] = Math.round(sum / div);
        sum -= tmp[Math.min(h - 1, Math.max(0, y - r)) * w + x];
        sum += tmp[Math.min(h - 1, Math.max(0, y + r + 1)) * w + x];
      }
    }
    return dst;
  }

  // ponytail: 5-degree sweep on thin dark strokes, same sign as PIL rotate (counter-clockwise).
  // Ceiling: a blank or glare-only frame returns 0 and this pass misses. Upgrade path: OSD deskew.
  function sourceRect() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const full = { x: 0, y: 0, w: vw, h: vh };
    const finder = document.getElementById("finder");
    if (!vw || !vh || !finder) return full;
    const box = video.getBoundingClientRect();
    const frame = finder.getBoundingClientRect();
    if (!box.width || !box.height || frame.width < 8 || frame.height < 8) return full;
    const scale = Math.max(box.width / vw, box.height / vh);
    const offX = (box.width - vw * scale) / 2;
    const offY = (box.height - vh * scale) / 2;
    let x = (frame.left - box.left - offX) / scale;
    let y = (frame.top - box.top - offY) / scale;
    let w = frame.width / scale;
    let h = frame.height / scale;
    if (x < 0) { w += x; x = 0; }
    if (y < 0) { h += y; y = 0; }
    if (x + w > vw) w = vw - x;
    if (y + h > vh) h = vh - y;
    if (w < 8 || h < 8) return full;
    return { x, y, w, h };
  }

  function detectAngle() {
    const src = sourceRect();
    if (!src.w || !src.h) return 0;
    const scale = 360 / Math.max(src.w, src.h);
    const w = Math.max(1, Math.round(src.w * scale));
    const h = Math.max(1, Math.round(src.h * scale));
    thumb.width = w;
    thumb.height = h;
    const ctx = thumb.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, src.x, src.y, src.w, src.h, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h).data;
    const gray = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      gray[p] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
    }
    const blur = boxBlur(gray, w, h, 3);
    const xs = [];
    const ys = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (gray[p] < 140 && blur[p] > 160) { xs.push(x); ys.push(y); }
      }
    }
    if (xs.length < 30) return 0;
    const cx = w / 2;
    const cy = h / 2;
    let bestA = 0;
    let bestV = -1;
    for (let a = -90; a <= 90; a += 5) {
      const rad = a * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      let minY = Infinity;
      let maxY = -Infinity;
      const yp = new Int16Array(xs.length);
      for (let i = 0; i < xs.length; i++) {
        const yy = Math.round(-sin * (xs[i] - cx) + cos * (ys[i] - cy));
        yp[i] = yy;
        if (yy < minY) minY = yy;
        if (yy > maxY) maxY = yy;
      }
      const hist = new Float64Array(maxY - minY + 1);
      for (let i = 0; i < yp.length; i++) hist[yp[i] - minY]++;
      let mean = 0;
      for (let i = 0; i < hist.length; i++) mean += hist[i];
      mean /= hist.length;
      let v = 0;
      for (let i = 0; i < hist.length; i++) {
        const d = hist[i] - mean;
        v += d * d;
      }
      v /= hist.length;
      if (v > bestV) { bestV = v; bestA = a; }
    }
    return bestA;
  }

  function grayscale(rgba) {
    for (let i = 0; i < rgba.length; i += 4) {
      const y = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
      rgba[i] = rgba[i + 1] = rgba[i + 2] = y;
    }
  }

  function median3(rgba, w, h) {
    const src = new Uint8Array(w * h);
    for (let p = 0, i = 0; p < src.length; p++, i += 4) src[p] = rgba[i];
    const dst = new Uint8Array(src.length);
    const win = new Uint8Array(9);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let k = 0;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = Math.min(h - 1, Math.max(0, y + dy));
          for (let dx = -1; dx <= 1; dx++) {
            const xx = Math.min(w - 1, Math.max(0, x + dx));
            win[k++] = src[yy * w + xx];
          }
        }
        win.sort();
        dst[y * w + x] = win[4];
      }
    }
    for (let p = 0, i = 0; p < dst.length; p++, i += 4) {
      rgba[i] = rgba[i + 1] = rgba[i + 2] = dst[p];
      rgba[i + 3] = 255;
    }
  }

  function autocontrast(rgba) {
    const hist = new Uint32Array(256);
    const n = rgba.length >> 2;
    for (let i = 0; i < rgba.length; i += 4) hist[rgba[i]]++;
    const skip = Math.floor(n * 0.01);
    let lo = 0;
    let hi = 255;
    let seen = 0;
    for (let i = 0; i < 256; i++) {
      seen += hist[i];
      if (seen > skip) { lo = i; break; }
    }
    seen = 0;
    for (let i = 255; i >= 0; i--) {
      seen += hist[i];
      if (seen > skip) { hi = i; break; }
    }
    if (hi <= lo) return;
    const scale = 255 / (hi - lo);
    for (let i = 0; i < rgba.length; i += 4) {
      const v = Math.max(0, Math.min(255, Math.round((rgba[i] - lo) * scale)));
      rgba[i] = rgba[i + 1] = rgba[i + 2] = v;
    }
  }

  function prepareFrame() {
    const src = sourceRect();
    if (!src.w || !src.h) return null;
    const angle = detectAngle();
    const fit = Math.min(3, 1600 / Math.max(src.w, src.h));
    const dw = Math.max(1, Math.round(src.w * fit));
    const dh = Math.max(1, Math.round(src.h * fit));
    const rad = -angle * Math.PI / 180;
    const c = Math.abs(Math.cos(rad));
    const s = Math.abs(Math.sin(rad));
    const cw = Math.max(1, Math.round(dw * c + dh * s));
    const ch = Math.max(1, Math.round(dw * s + dh * c));
    const canvas = document.createElement("canvas");
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, cw, ch);
    ctx.translate(cw / 2, ch / 2);
    ctx.rotate(rad);
    ctx.drawImage(video, src.x, src.y, src.w, src.h, -dw / 2, -dh / 2, dw, dh);
    const img = ctx.getImageData(0, 0, cw, ch);
    grayscale(img.data);
    median3(img.data, cw, ch);
    autocontrast(img.data);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(img, 0, 0);
    return canvas;
  }

  function getWorker() {
    if (!workerReady) {
      workerReady = Tesseract.createWorker("eng", 1, { logger() {} }, {
        load_system_dawg: "0",
        load_freq_dawg: "0",
      })
        .then(async (w) => {
          await w.setParameters({
            tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
            tessedit_pageseg_mode: "6",
          });
          worker = w;
          return w;
        })
        .catch((err) => {
          workerReady = null;
          throw err;
        });
    }
    return workerReady;
  }

  function stopCamera() {
    scanning = false;
    if (stream) {
      for (const track of stream.getTracks()) track.stop();
      stream = null;
    }
    video.srcObject = null;
  }

  function showResult(id) {
    const gen = ++generation;
    stopCamera();
    const qr = qrcode(0, "M");
    qr.addData(id);
    qr.make();
    qrEl.innerHTML = qr.createImgTag(8, 4);
    pidEl.textContent = id;
    show("result");
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (generation !== gen) return;
      show("home");
    }, 5000);
  }

  async function tick(gen) {
    if (!scanning || gen !== generation) return;
    if (video.readyState < 2) {
      setTimeout(() => tick(gen), 200);
      return;
    }
    statusEl.textContent = worker ? "Reading…" : "Loading reader…";
    const frame = prepareFrame();
    if (!frame) {
      setTimeout(() => tick(gen), 200);
      return;
    }
    try {
      const w = await getWorker();
      if (!scanning || gen !== generation) return;
      const { data } = await w.recognize(frame);
      if (!scanning || gen !== generation) return;
      const id = findPackageId(data.text || "");
      if (id) {
        showResult(id);
        return;
      }
    } catch (err) {
      if (scanning && gen === generation) statusEl.textContent = "Reading…";
    }
    if (scanning && gen === generation) setTimeout(() => tick(gen), 500);
  }

  scanBtn.onclick = async () => {
    if (typeof Tesseract === "undefined" || typeof qrcode !== "function") {
      alert("The scanner libraries failed to load. Check your connection.");
      return;
    }
    clearTimeout(timer);
    const gen = ++generation;
    statusEl.textContent = "Loading reader…";
    scanBtn.disabled = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
        },
      });
    } catch (err) {
      scanBtn.disabled = false;
      alert("Could not open the camera. Use HTTPS or localhost, and allow camera access.");
      return;
    }
    if (gen !== generation) {
      for (const track of stream.getTracks()) track.stop();
      stream = null;
      scanBtn.disabled = false;
      return;
    }
    video.srcObject = stream;
    video.playsInline = true;
    await video.play();
    scanning = true;
    show("cam");
    scanBtn.disabled = false;
    getWorker();
    tick(gen);
  };

  function backHome() {
    generation++;
    clearTimeout(timer);
    stopCamera();
    show("home");
  }

  document.getElementById("cancel").onclick = backHome;
  document.getElementById("dismiss").onclick = backHome;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  scanBtn.disabled = false;
</script>
</body>
</html>
