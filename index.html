<style>
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    background: #fff;
    color: #111;
    color-scheme: light;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .nav {
    flex: none;
    margin: 0;
    padding: max(.85rem, env(safe-area-inset-top)) 1rem .85rem;
    background: #111;
    color: #fff;
    text-align: center;

<script>
  const DIGIT_FIX = { O: "0", I: "1", L: "1", S: "5", B: "8" };

  // ponytail: fix O/I/L/S/B only in the 12-digit tail, and 1->T / 8->B only in the TB prefix.
  // Ceiling: Z/2 and G/6 still miss. Upgrade path: per-character OCR confidence.
  function findPackageId(text) {
    const compact = text.toUpperCase().replace(/\s+/g, "");
    let best = null;
    let bestCost = 99;
    for (let i = 0; i <= compact.length - 15; i++) {
      let cost = 0;
      let c0 = compact[i];
      let c1 = compact[i + 1];
      if (c0 === "1") { c0 = "T"; cost++; }
      else if (c0 !== "T") continue;
      if (c1 === "8") { c1 = "B"; cost++; }
      else if (c1 !== "B") continue;
      const letter = compact[i + 2];
      if (letter < "A" || letter > "Z") continue;
      const tail = compact.slice(i + 3, i + 15);
      let digits = "";
      let ok = true;
      for (const c of tail) {
        if (c >= "0" && c <= "9") digits += c;
        else if (DIGIT_FIX[c]) { digits += DIGIT_FIX[c]; cost++; }
        else { ok = false; break; }
      }
      if (!ok) continue;
      const id = "TB" + letter + digits;
      if (cost < bestCost) { best = id; bestCost = cost; }
    }
    return best;
  }

  function selfCheck() {
    const cases = [
      ["TBC086774826009", "TBC086774826009"],
      ["tbc086050802009", "TBC086050802009"],
      ["TBC085237824009", "TBC085237824009"],
      ["TBC08677\n4826009", "TBC086774826009"],
      ["TBCO860508020092", "TBC086050802009"],
      ["TBC086774B26009", "TBC086774826009"],
      ["18C086774826009", "TBC086774826009"],
      ["T8C085237824009", "TBC085237824009"],
      ["TBS086774826009", "TBS086774826009"],
      ["TBO086774826009", "TBO086774826009"],
      ["XZEBRASFOO19778143S4I09009XRPSL18C086774826009Q1PDMBAWCOA202DC", "TBC086774826009"],
      ["YZEBRAV20686S4O7ONBO4AMRP4SPTBC086050802009BBPIDXSBSNSJ0MHN001X11A203AI", "TBC086050802009"],
      ["QZEBRA680O31T0G0680S4SCPTBC085237824009844265F036414788210062XWCS2C91BC91C44", "TBC085237824009"],
      ["NSQZEBRA58694190080SCPPT8C085237824009Q84426503641WB47832100620C91BC91C4", "TBC085237824009"],
      ["SNtSJdgMHN_001_v", null],
      ["8cbcc442-6510-5641-cbcb-478ae210d62d", null],
      ["A-20.2D", null],
      ["TBC123", null],
    ];
    if (darkest(255, 250, 30) !== 30 || darkest(20, 240, 240) !== 20) {
      throw new Error("darkest channel");
    }
    for (const [input, expected] of cases) {
      const got = findPackageId(input);
      if (got !== expected) {
        throw new Error("findPackageId(" + JSON.stringify(input) + ") => " + got + ", expected " + expected);
      }
    }
  }
  selfCheck();

  const home = document.getElementById("home");
  const cam = document.getElementById("cam");
  const result = document.getElementById("result");
  const video = document.getElementById("video");
  const statusEl = document.getElementById("status");
  const qrEl = document.getElementById("qr");
  const pidEl = document.getElementById("pid");
  const scanBtn = document.getElementById("scan");
  const noteEl = document.getElementById("note");
  const thumb = document.createElement("canvas");

  let stream = null;
  let worker = null;
  let workerReady = null;
  let scanning = false;
  let timer = 0;
  let generation = 0;
  let frameBright = false;
  let brightStreak = 0;
  let exposure = null;
  const frameCanvas = document.createElement("canvas");
  const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });

  function show(which) {
    home.hidden = which !== "home";
    cam.hidden = which !== "cam";
    result.hidden = which !== "result";
  }

  function note(text, isError) {
    noteEl.textContent = text;
    noteEl.classList.toggle("error", !!isError);
  }

  function boxBlur(src, w, h, r) {
    const tmp = new Uint8Array(src.length);
    const dst = new Uint8Array(src.length);
    const div = r * 2 + 1;
    for (let y = 0; y < h; y++) {
      let sum = 0;
      for (let x = -r; x <= r; x++) sum += src[y * w + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = Math.round(sum / div);
        sum -= src[y * w + Math.min(w - 1, Math.max(0, x - r))];
        sum += src[y * w + Math.min(w - 1, Math.max(0, x + r + 1))];
      }
    }
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let y = -r; y <= r; y++) sum += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        dst[y * w + x] = Math.round(sum / div);
        sum -= tmp[Math.min(h - 1, Math.max(0, y - r)) * w + x];
        sum += tmp[Math.min(h - 1, Math.max(0, y + r + 1)) * w + x];
      }
    }
    return dst;
  }

  // ponytail: 5-degree sweep on thin dark strokes, same sign as PIL rotate (counter-clockwise).
  // Ceiling: a blank or glare-only frame returns 0 and this pass misses. Upgrade path: OSD deskew.
  function sourceRect() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const full = { x: 0, y: 0, w: vw, h: vh };
    const finder = document.getElementById("finder");
    if (!vw || !vh || !finder) return full;
    const box = video.getBoundingClientRect();
    const frame = finder.getBoundingClientRect();
    if (!box.width || !box.height || frame.width < 8 || frame.height < 8) return full;
    const scale = Math.max(box.width / vw, box.height / vh);
    const offX = (box.width - vw * scale) / 2;
    const offY = (box.height - vh * scale) / 2;
    let x = (frame.left - box.left - offX) / scale;
    let y = (frame.top - box.top - offY) / scale;
    let w = frame.width / scale;
    let h = frame.height / scale;
    if (x < 0) { w += x; x = 0; }
    if (y < 0) { h += y; y = 0; }
    if (x + w > vw) w = vw - x;
    if (y + h > vh) h = vh - y;
    if (w < 8 || h < 8) return full;
    return { x, y, w, h };
  }

  function detectAngle() {
    const src = sourceRect();
    if (!src.w || !src.h) return 0;
    const scale = 360 / Math.max(src.w, src.h);
    const w = Math.max(1, Math.round(src.w * scale));
    const h = Math.max(1, Math.round(src.h * scale));
    thumb.width = w;
    thumb.height = h;
    const ctx = thumb.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, src.x, src.y, src.w, src.h, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h).data;
    const gray = new Uint8Array(w * h);
    const hist = new Uint32Array(256);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const v = darkest(data[i], data[i + 1], data[i + 2]);
      gray[p] = v;
      hist[v]++;
    }
    const span = levels(hist, gray.length);
    if (span.hi > span.lo) {
      const scale = 255 / (span.hi - span.lo);
      for (let i = 0; i < gray.length; i++) {
        gray[i] = Math.max(0, Math.min(255, Math.round((gray[i] - span.lo) * scale)));
      }
    }
    const blur = boxBlur(gray, w, h, 3);
    const xs = [];
    const ys = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = y * w + x;
        if (gray[p] < 140 && blur[p] > 160) { xs.push(x); ys.push(y); }
      }
    }
    if (xs.length < 30) return 0;
    const cx = w / 2;
    const cy = h / 2;
    let bestA = 0;
    let bestV = -1;
    for (let a = -90; a <= 90; a += 5) {
      const rad = a * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      let minY = Infinity;
      let maxY = -Infinity;
      const yp = new Int16Array(xs.length);
      for (let i = 0; i < xs.length; i++) {
        const yy = Math.round(-sin * (xs[i] - cx) + cos * (ys[i] - cy));
        yp[i] = yy;
        if (yy < minY) minY = yy;
        if (yy > maxY) maxY = yy;
      }
      const hist = new Float64Array(maxY - minY + 1);
      for (let i = 0; i < yp.length; i++) hist[yp[i] - minY]++;
      let mean = 0;
      for (let i = 0; i < hist.length; i++) mean += hist[i];
      mean /= hist.length;
      let v = 0;
      for (let i = 0; i < hist.length; i++) {
        const d = hist[i] - mean;
        v += d * d;
      }
      v /= hist.length;
      if (v > bestV) { bestV = v; bestA = a; }
    }
    return bestA;
  }

  // ponytail: the darkest channel survives when white balance clips the others.
  // Ceiling: glare that clips red, green, and blue still needs a tilt. Upgrade path: metered exposure burst.
  function darkest(r, g, b) {
    return r < g ? (r < b ? r : b) : (g < b ? g : b);
  }

  function levels(hist, n) {
    const skip = Math.floor(n * 0.01);
    let lo = 0;
    let hi = 255;
    let seen = 0;
    for (let i = 0; i < 256; i++) {
      seen += hist[i];
      if (seen > skip) { lo = i; break; }
    }
    seen = 0;
    for (let i = 255; i >= 0; i--) {
      seen += hist[i];
      if (seen > skip) { hi = i; break; }
    }
    return { lo: lo, hi: hi, blown: lo > 180 && hi > 245 };
  }

  function flatten(rgba) {
    const hist = new Uint32Array(256);
    const n = rgba.length >> 2;
    for (let i = 0; i < rgba.length; i += 4) {
      const v = darkest(rgba[i], rgba[i + 1], rgba[i + 2]);
      rgba[i] = rgba[i + 1] = rgba[i + 2] = v;
      hist[v]++;
    }
    const span = levels(hist, n);
    frameBright = span.blown;
    if (span.hi <= span.lo) return;
    const scale = 255 / (span.hi - span.lo);
    for (let i = 0; i < rgba.length; i += 4) {
      const v = Math.max(0, Math.min(255, Math.round((rgba[i] - span.lo) * scale)));
      rgba[i] = rgba[i + 1] = rgba[i + 2] = v;
    }
  }

  function prepareFrame() {
    const src = sourceRect();
    if (!src.w || !src.h) return null;
    const angle = detectAngle();
    // ponytail: cap the long side at 960 and never enlarge. OCR time follows pixel count.
    // Ceiling: a scanner that stays tiny in the frame can miss. Upgrade path: one larger retry after several misses.
    const long = Math.max(src.w, src.h);
    const fit = long > 960 ? 960 / long : 1;
    const dw = Math.max(1, Math.round(src.w * fit));
    const dh = Math.max(1, Math.round(src.h * fit));
    const canvas = frameCanvas;
    const ctx = frameCtx;
    if (!angle) {
      canvas.width = dw;
      canvas.height = dh;
      ctx.drawImage(video, src.x, src.y, src.w, src.h, 0, 0, dw, dh);
    } else {
      const rad = -angle * Math.PI / 180;
      const c = Math.abs(Math.cos(rad));
      const s = Math.abs(Math.sin(rad));
      canvas.width = Math.max(1, Math.round(dw * c + dh * s));
      canvas.height = Math.max(1, Math.round(dw * s + dh * c));
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(rad);
      ctx.drawImage(video, src.x, src.y, src.w, src.h, -dw / 2, -dh / 2, dw, dh);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    flatten(img.data);
    ctx.putImageData(img, 0, 0);
    return canvas;
  }

  function applyTrack(track, adv) {
    if (!track || !Object.keys(adv).length) return;
    track.applyConstraints({ advanced: [adv] }).catch(() => {});
  }

  function tuneCamera(track) {
    exposure = null;
    brightStreak = 0;
    if (!track || !track.getCapabilities) return;
    let caps;
    try { caps = track.getCapabilities(); } catch (err) { return; }
    const adv = {};
    if (caps.focusMode && caps.focusMode.indexOf("continuous") >= 0) adv.focusMode = "continuous";
    if (caps.exposureMode && caps.exposureMode.indexOf("continuous") >= 0) adv.exposureMode = "continuous";
    const comp = caps.exposureCompensation;
    if (comp && comp.max > comp.min) {
      const step = comp.step || 0.1;
      let value = comp.min + (comp.max - comp.min) * 0.35;
      value = Math.round(value / step) * step;
      value = Math.max(comp.min, Math.min(comp.max, value));
      adv.exposureCompensation = value;
      exposure = { track: track, min: comp.min, max: comp.max, step: step, value: value };
    }
    applyTrack(track, adv);
    const temp = caps.colorTemperature;
    if (caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf("manual") >= 0 && temp && temp.max > temp.min) {
      const kelvin = Math.max(temp.min, Math.min(temp.max, 6500));
      applyTrack(track, { whiteBalanceMode: "manual", colorTemperature: kelvin });
    } else if (caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf("continuous") >= 0) {
      applyTrack(track, { whiteBalanceMode: "continuous" });
    }
  }

  function darken() {
    if (!exposure) return;
    const track = exposure.track;
    let value = exposure.value - Math.max(exposure.step, (exposure.max - exposure.min) * 0.15);
    value = Math.round(value / exposure.step) * exposure.step;
    value = Math.max(exposure.min, Math.min(exposure.max, value));
    if (value === exposure.value) return;
    track.applyConstraints({ advanced: [{ exposureCompensation: value }] })
      .then(() => { if (exposure && exposure.track === track) exposure.value = value; })
      .catch(() => {});
  }

  function getWorker() {
    if (!workerReady) {
      workerReady = Tesseract.createWorker("eng", 1, { logger() {} }, {
        load_system_dawg: "0",
        load_freq_dawg: "0",
      })
        .then(async (w) => {
          await w.setParameters({
            tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
            tessedit_pageseg_mode: "6",
          });
          worker = w;
          return w;
        })
        .catch((err) => {
          workerReady = null;
          throw err;
        });
    }
    return workerReady;
  }

  function stopCamera() {
    scanning = false;
    if (stream) {
      for (const track of stream.getTracks()) track.stop();
      stream = null;
    }
    video.srcObject = null;
    exposure = null;
    brightStreak = 0;
  }

  function showResult(id) {
    const gen = ++generation;
    stopCamera();
    const qr = qrcode(0, "M");
    qr.addData(id);
    qr.make();
    qrEl.innerHTML = qr.createImgTag(8, 4);
    pidEl.textContent = id;
    track("scan_success");
    show("result");
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (generation !== gen) return;
      show("home");
    }, 5000);
  }

  async function tick(gen) {
    if (!scanning || gen !== generation) return;
    if (video.readyState < 2) {
      setTimeout(() => tick(gen), 200);
      return;
    }
    const frame = prepareFrame();
    if (!frame) {
      setTimeout(() => tick(gen), 200);
      return;
    }
    if (frameBright) {
      brightStreak++;
      statusEl.textContent = "Tilt off the glare";
      if (brightStreak === 4 || brightStreak === 8) darken();
    } else {
      brightStreak = 0;
      statusEl.textContent = worker ? "Reading…" : "Loading reader…";
    }
    try {
      const w = await getWorker();
      if (!scanning || gen !== generation) return;
      const { data } = await w.recognize(frame);
      if (!scanning || gen !== generation) return;
      const id = findPackageId(data.text || "");
      if (id) {
        showResult(id);
        return;
      }
    } catch (err) {
      if (scanning && gen === generation) statusEl.textContent = "Reading…";
    }
    if (scanning && gen === generation) setTimeout(() => tick(gen), 0);
  }

  let networkOrg = "";
  let visitSent = false;

  function track(event) {
    if (!window.posthog || !posthog.capture) return;
    const props = {};
    if (networkOrg) props.network_org = networkOrg;
    posthog.capture(event, props);
  }

  function trackVisit() {
    if (visitSent) return;
    visitSent = true;
    if (networkOrg && posthog.register) posthog.register({ network_org: networkOrg });
    track("$pageview");
  }

  fetch("https://ipinfo.io/json")
    .then((res) => res.ok ? res.json() : null)
    .then((data) => { if (data && data.org) networkOrg = data.org; })
    .catch(() => {})
    .finally(trackVisit);
  setTimeout(trackVisit, 2500);

  function cameraNote() {
    if (!window.isSecureContext) {
      return "Safari will not show the camera prompt here. Open https://" + location.hostname + ":8443, continue past the certificate warning, then tap Scan.";
    }
    return "Safari will not ask again. Tap AA in the address bar, open Website Settings, set Camera to Allow, then tap Scan.";
  }

  function openCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      note(cameraNote(), true);
      return Promise.resolve(null);
    }
    return navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
    }).catch((err) => {
      const name = err && err.name;
      if (name === "OverconstrainedError" || name === "NotFoundError") {
        return navigator.mediaDevices.getUserMedia({ audio: false, video: true });
      }
      note(cameraNote(), true);
      return null;
    }).catch(() => {
      note(cameraNote(), true);
      return null;
    });
  }

  scanBtn.onclick = async () => {
    if (typeof Tesseract === "undefined" || typeof qrcode !== "function") {
      note("The scanner failed to load. Check your connection, then try Scan again.", true);
      return;
    }
    track("scan_started");
    clearTimeout(timer);
    const gen = ++generation;
    statusEl.textContent = "Loading reader…";
    note("Point the camera at the scanner screen.");
    scanBtn.disabled = true;
    stream = await openCamera();
    if (!stream) {
      scanBtn.disabled = false;
      return;
    }
    if (gen !== generation) {
      for (const track of stream.getTracks()) track.stop();
      stream = null;
      scanBtn.disabled = false;
      return;
    }
    video.srcObject = stream;
    video.playsInline = true;
    await video.play();
    tuneCamera(stream.getVideoTracks()[0]);
    scanning = true;
    show("cam");
    scanBtn.disabled = false;
    getWorker();
    tick(gen);
  };

  function backHome() {
    generation++;
    clearTimeout(timer);
    stopCamera();
    note("Point the camera at the scanner screen.");
    show("home");
  }

  document.getElementById("cancel").onclick = backHome;
  document.getElementById("dismiss").onclick = backHome;

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  if (typeof Tesseract !== "undefined") getWorker();

  if (window.isSecureContext) note("Point the camera at the scanner screen.");
  else note(cameraNote(), true);
  scanBtn.disabled = false;
</script>
</body>
</html>
